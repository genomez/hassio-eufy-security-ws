name: Qualify RC3 initialization candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc3-init-startup-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    if: github.ref == 'refs/heads/rc3-init-startup-qualification-20261012'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ORIGINAL: ghcr.io/genomez/eufy-security-ws-rc3-login-retry-amd64@sha256:897eeac38d4cff847083c4d8f16519e825f15883120812280a2dcda5061482ee
      CANDIDATE: local/eufy-rc3-init:3.0.18-regional-rtc-rc3-login-retry.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pull the exact public parent and build configuration-only correction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification-results
          docker pull "$ORIGINAL"
          docker build --network none --pull=false --tag "$CANDIDATE" --file qualification/rc3-init-startup/Dockerfile.candidate qualification/rc3-init-startup
          python3 qualification/rc3-init-startup/compare_images.py --original "$ORIGINAL" --candidate "$CANDIDATE" --output qualification-results
      - name: Qualify genuine default startup and shutdown with synthetic data
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 240s python3 qualification/rc3-init-startup/fixtures/qualify.py --original "$ORIGINAL" --candidate "$CANDIDATE" --output qualification-results/STARTUP_QUALIFICATION.json
      - name: Export and bind qualified candidate without publishing
        shell: bash
        run: |
          set -euo pipefail
          docker image save "$CANDIDATE" | gzip -n > qualification-results/candidate-image.tar.gz
          python3 qualification/rc3-init-startup/seal_export.py --export qualification-results/candidate-image.tar.gz --results qualification-results
      - name: Retain qualification receipts and exact candidate export
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc3-init-startup-qualification-${{ github.run_id }}
          path: |
            qualification-results/*.json
            qualification-results/EXPORT_SHA256.txt
            qualification-results/candidate-image.tar.gz
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
